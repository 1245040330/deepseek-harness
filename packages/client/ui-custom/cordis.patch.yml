# Keep the default sources in the profile, but mount only the copied implementations.
- insert:
    - id: business-login
      name: '../../../plugins/business-login/index.ts'
      config:
        rootDirectory: '/workspace/'
        pluginsDir: '..'
        timeoutMs: 30000
- id: connection
  disabled: true
- id: web-runtime
  disabled: true
- insert:
    - id: business-connection
      name: './connection/lib/index.js'
      inject: [webStartup]
      config:
        trustedHosts: !!js ctx.webStartup.trustedHosts
        loginEndpoint: 'https://gl.jinjiaoyun.com/zhijiaoyun/chatgpt/ChatGPTPublicBAL/getHarnessLoginInfo.call'
        loginTimeoutMs: 30000
    - id: business-web-runtime
      name: '../../../plugins/business-frontend/index.ts'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        publicUrl: !!js ctx.webStartup.publicUrl
        surfaceContext: true
- id: ui-model-selection
  disabled: true
- id: ui-layout
  disabled: true
- id: ui-sidebar
  disabled: true
- id: ui-conversation
  disabled: true
- insert:
    - id: ui-custom-layout
      name: './ui-layout/lib/index.js'
    - id: ui-custom-sidebar
      name: './ui-sidebar/lib/index.js'
    - id: ui-custom-conversation
      name: './ui-conversation/lib/index.js'
# Custom settings navigation: hide UI entries without disabling their Host capabilities.
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-chat
  disabled: true
- insert:
    - id: ui-custom-chat
      name: './ui-chat/lib/index.js'

- id: ui-workspace
  disabled: true
- insert:
    - id: ui-custom-workspace
      name: './ui-workspace/lib/index.js'
